<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Satıcı başvurunuz onaylandı</title>
  </head>
  <body style="margin:0;background:#f5f6f9;font-family:Arial,sans-serif;color:#202432">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f5f6f9;padding:32px 12px">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:600px;background:#fff;border:1px solid #e6e8ee;border-top:5px solid #ff4f30;border-radius:8px">
            <tr><td style="padding:32px 34px 18px;text-align:center">
              <img src="https://marketplace-platform-seller-panel.vercel.app/img/anayazi.png" width="190" alt="BişeyEksik" style="display:inline-block;max-width:190px;height:auto" />
            </td></tr>
            <tr><td style="padding:0 34px 34px">
              <h1 style="margin:0 0 12px;font-size:24px;line-height:1.3;text-align:center">Satıcı başvurunuz onaylandı</h1>
              <p style="margin:0 0 18px;color:#687080;font-size:14px;line-height:1.7;text-align:center">
                Tebrikler, BişeyEksik satıcı hesabınız kullanıma hazır. Güvenli şifrenizi oluşturarak mağaza yönetimine başlayabilirsiniz.
              </p>
              <div style="text-align:center;margin:26px 0">
                <a href="https://marketplace-platform-seller-panel.vercel.app/davet/onay?token_hash={{ .TokenHash }}&amp;type=invite&amp;sonraki=/sifre-olustur" style="display:inline-block;background:#ff4f30;color:#fff;text-decoration:none;font-size:14px;font-weight:700;padding:15px 24px;border-radius:6px">Satıcı Şifremi Oluştur</a>
              </div>
              <p style="margin:18px 0 0;color:#858b98;font-size:11px;line-height:1.6;text-align:center">
                Bu bağlantı yalnızca size özeldir. Başvuruyu siz yapmadıysanız bu e-postayı dikkate almayın.
              </p>
            </td></tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
